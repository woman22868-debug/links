<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valerie 🤍</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #121013;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Фоновое изображение */
        .bg-image {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.35) saturate(1.2);
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(18,16,19,0.2), rgba(18,16,19,0.85));
            z-index: -1;
        }

        /* Шапка профиля */
        .profile-section {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .avatar-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            overflow: hidden;
            border: 2.5px solid rgba(255, 182, 193, 0.7);
            box-shadow: 0 0 25px rgba(255, 182, 193, 0.35);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .profile-handle {
            font-size: 15px;
            color: #f7a8b8;
            margin-top: 4px;
            font-weight: 400;
        }

        /* Био / цитата */
        .bio-box {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 182, 193, 0.15);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: #ffd1dc;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Контейнер ссылок */
        .links-container {
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Карточки-ссылки */
        .link-card {
            background: rgba(30, 24, 29, 0.75);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 182, 193, 0.2);
            border-radius: 20px;
            padding: 16px 22px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .link-card:hover {
            background: rgba(45, 34, 42, 0.9);
            border-color: rgba(255, 182, 193, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.15);
        }

        .link-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }

        .link-title {
            flex-grow: 1;
            letter-spacing: 0.3px;
        }

        .link-arrow {
            color: #f7a8b8;
            font-size: 14px;
            opacity: 0.7;
            transition: transform 0.2s;
        }

        .link-card:hover .link-arrow {
            transform: translateX(3px);
            opacity: 1;
        }

        /* Telegram акцентная розовая */
        .link-card.tg-accent {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.3), rgba(168, 85, 247, 0.3));
            border-color: rgba(236, 72, 153, 0.5);
        }
        .link-card.tg-accent:hover {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.45), rgba(168, 85, 247, 0.45));
            border-color: rgba(236, 72, 153, 0.8);
        }

        .footer {
            margin-top: 50px;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="overlay"></div>

    <!-- Шапка -->
    <div class="profile-section">
        <div class="avatar-container">
            <img src="bg.jpg" alt="Valerie">
        </div>
        <h1 class="profile-name">Valerie <span style="font-size: 20px;">✨</span></h1>
        <p class="profile-handle">@lelimammi</p>
    </div>

    <div class="bio-box">
        Ur exotic golden blonde ⭐ Welcome to my space
    </div>

    <!-- Кнопки -->
    <div class="links-container">
        
        <!-- Telegram -->
        <a href="https://t.me/+6qNTIDuzPOBmYzVk" target="_blank" class="link-card tg-accent">
            <div class="link-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21.5 3.5L2.5 10.8C1.2 11.3 1.2 12.7 2.3 13.1L7.2 14.7L9 20.2C9.2 20.8 9.8 21 10.3 20.6L13.4 17.8L18.1 21.3C19 22 20.3 21.5 20.5 20.4L23.4 5C23.7 3.8 22.6 2.9 21.5 3.5ZM18.5 7.5L9.5 14.5L8 18.5L7 14L18.5 7.5Z" fill="#ffb6c1"/>
                </svg>
            </div>
            <span class="link-title">Telegram Channel</span>
            <span class="link-arrow">➔</span>
        </a>

        <!-- TikTok -->
        <a href="https://www.tiktok.com/@valeria_mommy0?_r=1&_t=ZS-9AHa39dcucK" target="_blank" class="link-card">
            <div class="link-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19.59 6.69A4.83 4.83 0 0115.82 2.44V2h-3.45v13.67a2.89 2.89 0 11-2.89-2.89c.31 0 .61.05.89.15V9.38a6.34 6.34 0 105.77 6.31V8.24a8.28 8.28 0 004.35 1.25V6.03a4.83 4.83 0 01-1.9-0.59z" fill="#ffb6c1"/>
                </svg>
            </div>
            <span class="link-title">TikTok Profile</span>
            <span class="link-arrow">➔</span>
        </a>

    </div>

    <div class="footer">
        Valerie Links
    </div>

</body>
</html>
