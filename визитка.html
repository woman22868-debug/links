<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f0c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 30px;
            color: #00ff66;
            letter-spacing: 1px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background-color: #121c15;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #1e3324;
            font-size: 16px;
            font-weight: 500;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #1e3324;
            border-color: #00ff66;
            color: #00ff66;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>// NAVIGATION</h1>
        <!-- Ссылка на твой Telegram -->
        <a href="https://t.me/+6qNTIDuzPOBmYzVk" class="btn" target="_blank">Telegram Channel</a>
        <!-- Ссылка на твой TikTok -->
        <a href="https://www.tiktok.com/@valeria_mommy0?_r=1&_t=ZS-9AHa39dcucK" class="btn" target="_blank">TikTok</a>
    </div>
</body>
</html>
